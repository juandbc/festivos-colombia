name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
    publish-gpr:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6.5.0
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com/
            - run: npm ci
            - run: npm run build
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    publish-jsr:
        runs-on: ubuntu-latest
        permissions:
              contents: read
              id-token: write
        steps:
            - uses: actions/checkout@v7
            - name: Publish package
              run: npx jsr publish
